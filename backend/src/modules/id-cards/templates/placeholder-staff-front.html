<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 85.6mm; height: 54mm; font-family: Inter, Arial, sans-serif; font-size: 8pt; color: #1f2937; }
    .header { background: var(--pdf-grad-mid, linear-gradient(135deg, #0d9488, #115e59)); color: #fff; padding: 3mm 4mm; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 9pt; font-weight: 700; }
    .header img { height: 10mm; max-width: 18mm; object-fit: contain; }
    .body { padding: 3mm 4mm; display: flex; gap: 3mm; }
    .photo { width: 22mm; height: 26mm; border-radius: 2mm; object-fit: cover; border: 1px solid #e5e7eb; }
    .name { font-size: 11pt; font-weight: 700; }
    .meta { font-size: 7.5pt; line-height: 1.35; margin-top: 1mm; }
    .footer { padding: 0 4mm 3mm; font-size: 7pt; display: flex; justify-content: space-between; }
    .qr { width: 14mm; height: 14mm; }
  </style>
</head>
<body>
  <div class="header">
    <div><h1>{{schoolName}}</h1><div style="font-size:7pt">{{academicYearLabel}}</div></div>
    {{#if schoolLogoUrl}}<img src="{{schoolLogoUrl}}" alt="" style="height:10mm" />{{/if}}
  </div>
  <div class="body">
    {{#if photoUrl}}<img class="photo" src="{{photoUrl}}" alt="" />{{/if}}
    <div>
      <div class="name">{{fullName}}</div>
      <div class="meta">{{roleLabel}}<br/>{{classSection}}<br/>ID: {{rollOrEmployeeId}}<br/>{{phone}}</div>
    </div>
  </div>
  <div class="footer">
    <span>{{cardNumber}} · {{validFrom}} – {{validUntil}}</span>
    {{#if qrCodeDataUrl}}<img class="qr" src="{{qrCodeDataUrl}}" alt="" />{{/if}}
  </div>
</body>
</html>
